[versions]
agp = "8.3.2"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

#autosize(今日头条屏幕适配方案) https://github.com/JessYanCoding/AndroidAutoSize
androidAutoSize = { module = "com.github.JessYanCoding:AndroidAutoSize", version = "v1.2.1" }

#BaseRecyclerViewAdapterHelper https://github.com/CymChad/BaseRecyclerViewAdapterHelper
base-recycler-view = { module = "com.github.CymChad:BaseRecyclerViewAdapterHelper", version = "3.0.7" }

#okhttp https://github.com/square/okhttp
okhttp3 = { module = "com.squareup.okhttp3:okhttp", version = "4.9.0" }
okhttp3-logging = { module = "com.squareup.okhttp3:logging-interceptor", version = "4.9.0" }

#retrofit2 https://github.com/square/retrofit
retrofit2 = { module = "com.squareup.retrofit2:retrofit", version = "2.9.0" }
retrofit2-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version = "2.9.0" }
retrofit2-adapter-rxjava2 = { module = "com.squareup.retrofit2:adapter-rxjava2", version = "2.9.0" }

rxjava2-rxjava = { module = "io.reactivex.rxjava2:rxjava", version = "2.2.4" }
rxjava2-rxandroid = { module = "io.reactivex.rxjava2:rxandroid", version = "2.1.1" }

#谷歌定位
google-location = { module = "com.google.android.gms:play-services-location", version = "21.0.1" }

#权限库
xxpermissions = { group = "com.github.getActivity", name = "XXPermissions", version = "26.5" }

work = { group = "androidx.work", name = "work-runtime-ktx", version = "2.7.0" }

#高德定位
gd-amap={group ="'com.amap.api" ,name ="location", version="latest.integration"}

#XPopup弹窗库 https://github.com/junixapp/XPopup
xpopup = { group = "com.github.li-xiaojun", name = "XPopup", version = "2.10.0" }

#LiveEventBus https://github.com/neo-turak/LiveEventBus
live-eventbus = { group = "com.github.neo-turak", name = "LiveEventBus", version = "1.8.1" }